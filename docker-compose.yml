services:
  neo4j:
    image: neo4j:5.26.2-enterprise
    ports:
      - 7474:7474
      - 7687:7687
    environment:
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_AUTH=neo4j/letmeinnow
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_db_logs_query_enabled=INFO
      - NEO4J_dbms_logs_query_time__logging__enabled=true
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - "./volumes/neo4j/data:/data"
      - "./volumes/neo4j/plugins:/plugins"
  api:
    build: ./api
    ports:
      - 4000:4000
    links:
      - neo4j
    depends_on:
      - neo4j
    environment:
      - DEBUG=@neo4j/graphql:*
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=letmeinnow
      - GRAPHQL_LISTEN_PORT=4000
      - JWT_SECRET=a-string-secret-at-least-256-bits-long
