<form nz-form [formGroup]="skillForm" (ngSubmit)="onSubmit()">
  <nz-form-item>
    <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="name">Name</nz-form-label>
    <nz-form-control [nzSm]="14" [nzXs]="24">
      <input nz-input formControlName="name" id="name"/>
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="parents">Parents</nz-form-label>
    <nz-form-control [nzSm]="14" [nzXs]="24">
      <nz-select
        [nzId]="'parents'"
        formControlName="parents"
        nzAllowClear
        [nzMode]="'multiple'"
        nzPlaceHolder="Skill groups that should include this group"
      >
        <nz-option *ngFor="let option of groups" [nzLabel]="option.label" [nzValue]="option.value" />
      </nz-select>
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="children">Children</nz-form-label>
    <nz-form-control [nzSm]="14" [nzXs]="24">
      <nz-select
        [nzId]="'children'"
        formControlName="children"
        nzAllowClear
        [nzMode]="'multiple'"
        nzPlaceHolder="Skills or skill groups that should belong to this group"
      >
        <nz-option-group nzLabel="Skill Groups">
          <nz-option *ngFor="let option of groups" [nzLabel]="option.label" [nzValue]="option.value" />
        </nz-option-group>
        <nz-option-group nzLabel="Skills">
          <nz-option *ngFor="let option of skills" [nzLabel]="option.label" [nzValue]="option.value" />
        </nz-option-group>
      </nz-select>
    </nz-form-control>
  </nz-form-item>

  <nz-form-item nz-row class="register-area">
    <nz-form-control [nzSpan]="14" [nzOffset]="6">
      <nz-space [nzSize]="'small'">
        <button *nzSpaceItem nz-button nzType="primary" [disabled]="!skillForm.valid">Submit</button>
        <button *nzSpaceItem nz-button type="button" (click)="cancel()">Cancel</button>
      </nz-space>
    </nz-form-control>
  </nz-form-item>
</form>
