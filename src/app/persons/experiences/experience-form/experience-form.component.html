<div class="experienceForm" >
<nz-empty *ngIf="!experiences || experiences.length === 0"></nz-empty>
<form nz-form [formGroup]="experienceForm" >
  <ng-container formArrayName="experiences">
    <nz-list nzGrid>
      <div nz-row [nzGutter]="24">
        <div nz-col [nzXXl]="24" [nzXl]="24" *ngFor="let experience of experiences.controls; let idx = index" [formGroupName]="idx">
          <nz-list-item>
            <nz-card [nzTitle]="experienceType === ExperienceType.Hobby ? cardHobbyTitle : cardTitle">
              <ng-template #cardTitle>{{ (experience.value.name ?? experience.value.role) + ' ' + ([experience.value.startedFrom, experience.value.gainedAt] | cvDateRange) }}</ng-template>
              <ng-template #cardHobbyTitle>{{ experience.value.name }}</ng-template>
              <nz-form-item *ngIf="efb.isVisible('name')">
                <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="name">Name</nz-form-label>
                <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Name is required.">
                  <input nz-input formControlName="name" id="name" />
                </nz-form-control>
              </nz-form-item>
              <nz-form-item *ngIf="efb.isVisible('role')">
                <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="name">Role</nz-form-label>
                <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Role is required.">
                  <input nz-input formControlName="role" id="role" />
                </nz-form-control>
              </nz-form-item>
              <nz-form-item *ngIf="efb.isVisible('institution')">
                <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="name">Institution</nz-form-label>
                <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Institution is required.">
                  <input nz-input formControlName="institution" id="institution" />
                </nz-form-control>
              </nz-form-item>
              <nz-form-item *ngIf="efb.isVisible('description')">
                <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="description" nzRequired>Description</nz-form-label>
                <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Please give description!">
                  <nz-textarea-count [nzMaxCharacterCount]="1000">
                  <textarea
                    nz-input
                    id="description"
                    formControlName="description"
                    rows="3"
                    placeholder="Describe experience"
                  ></textarea>
                  </nz-textarea-count>
                </nz-form-control>
              </nz-form-item>
              <nz-form-item *ngIf="efb.isVisible('startedFrom') && efb.isVisible('gainedAt')">
                  <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="startedFrom" nzRequired>Started from</nz-form-label>
                  <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Select valid starting date!">
                    <nz-date-picker formControlName="startedFrom"></nz-date-picker>
                  </nz-form-control>
                  <nz-form-label [ngStyle]="{'text-align': 'left', 'margin-left':'0.5rem'}" nzFor="gainedAt">Gained at</nz-form-label>
                  <nz-form-control [nzSm]="14" [nzXs]="24">
                    <nz-date-picker formControlName="gainedAt"></nz-date-picker>
                  </nz-form-control>
              </nz-form-item>
              <nz-form-item *ngIf="efb.isVisible('skills')">
                <nz-form-label [nzSm]="6" [nzXs]="24" [nzFor]="'skills'">Skills</nz-form-label>
                <nz-form-control [nzSm]="14" [nzXs]="24">
                  <nz-select
                    nzMode="multiple"
                    nzPlaceHolder="Please select skills"
                    formControlName="skills"
                  >
                    <nz-option *ngFor="let skill of skills | async" [nzLabel]="skill.name" [nzValue]="skill.id"></nz-option>
                  </nz-select>
                </nz-form-control>
              </nz-form-item>
              <nz-form-item>
                <nz-form-control class="btn-center">
                    <nz-space [nzSize]="'small'">
                    <button
                    type="submit"
                    [disabled]="!(experience.status === 'VALID') || !experience.dirty"
                    *nzSpaceItem nz-button nzType="primary" (click)="submitNewExperience(experience)">
                      Submit
                    </button>
                    <button
                    class="btn-sm"
                    nzDanger
                    nz-button
                    nzType="primary"
                    nz-popconfirm
                    nzPopconfirmTitle="Are you sure you want to delete this experience?"
                    (nzOnConfirm)="deleteExperience(idx, experience)"
                    (nzOnCancel)="cancelDelete()"
                  >
                   Remove
                  </button>
                    </nz-space>
                </nz-form-control>
              </nz-form-item>
            </nz-card>
          </nz-list-item>
        </div>
      </div>
    </nz-list>
    <nz-form-item>
      <nz-form-control class="btn-center">
        <button nzSize="large" nz-button nzType="primary" (click)="addNewForm()">
          Add new
        </button>
      </nz-form-control>
    </nz-form-item>
  </ng-container>
</form>
</div>
