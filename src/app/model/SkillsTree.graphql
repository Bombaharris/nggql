query SkillsTree($where: SkillGroupWhere) {
  skillGroups(where: $where) {
    id
    name
    children {
      ... on SkillGroup {
        __typename
        id
        name
        childrenConnection {
          totalCount
        }
      }
      ... on Skill {
        __typename
        id
        name
      }
    }
    childrenConnection {
      totalCount
    }
  }
}
